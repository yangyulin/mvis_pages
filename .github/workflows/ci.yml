name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: site (npm test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      # outDir is ../docs, outside site/, so Astro 6 reads its optimised source
      # images from site/.astro/_astro/. On a fresh install that folder does not
      # exist and the build dies with ENOENT; point it at the build output.
      - run: mkdir -p .astro && ln -s ../../docs/_astro .astro/_astro
      - run: npm run build

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy<2" pyyaml pytest pillow
      # The real_data tests skip without the private results named by env.
      - run: python -m pytest -q
