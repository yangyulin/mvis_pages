# Text for the public openmvis.com sensor pages. Written fresh: no maker-versus-MVIS comparison, internal path, code hash or device id.
# Numbers come from the run named by `key` in the private sensors.yaml (kept in mira, passed to export_sensors.py by path).
# A demo `from` names the clip; the private sensors.yaml maps it to the file in the media folder (demo_media) when that name holds a device id.
# Only sensors listed here reach the site.
data_url: https://huggingface.co/datasets/calibench-vi/datasets/tree/main
groups:
  - {id: cameras, title: Tracking cameras and modules}
  - {id: head-worn, title: Head-worn cameras}
  - {id: vr, title: VR headsets}
# The order below is the order on the site: sidebar and Sensors overview. Every sensor needs a group.
sensors:
  intel-t265:
    group: cameras
    key: intel-t265
    title: Intel RealSense T265
    description: Global-shutter fisheye stereo tracking camera with a BMI055 IMU, calibrated with MVIS on one recording of our rig.
    lead: Tracking camera from Intel with two global-shutter fisheye cameras and a Bosch BMI055 IMU, solved here on its own IMU from one recording of our VI-Rig.
    chips: [Global shutter, Stereo fisheye, 200 Hz IMU, CC BY-NC 4.0]
    card: {name: "T265", tags: [Global shutter, 2 cameras, 200 Hz IMU], sensors: "Stereo global-shutter fisheye + BMI055 @ 200 Hz", format: "ROS bag", shows: "A low-cost IMU with a gyro-to-accel time offset"}
    source: https://www.intelrealsense.com/tracking-camera-t265/
    source_label: Intel RealSense T265 page
    checked: 2026-11-03
    company: {name: Intel RealSense, url: "https://www.intelrealsense.com/"}
    hardware:
      - [Cameras, "2 × OV9282, 848×800 at 30 Hz", Maker]
      - [Shutter, Global, Maker]
      - [Lens, "Fisheye, about 163°", Maker]
      - [IMU, "Bosch BMI055, gyro at 200 Hz, accel at 62.5 Hz", Measured]
    dataset:
      - [Recording, "VI-Rig, recording 1, 80 s window chosen by motion"]
      - [Format, ROS bag]
      - [Board, "AprilGrid 6×6, tag 88 mm, spacing 0.3, t36h11"]
      - [Configs and results, "__HUB:community/intel-t265/__"]
    folder: virig-4imus-3cams/
    method: "Fisheye stereo plus the T265's own IMU, camera intrinsics free, t_ga on. Batch of 2026-11-03."
    limits:
      - One recording, with no independent reference on this page. These values show what MVIS solved, not how close they are to the truth.
      - The T265 gyro-to-accel offset isn't a pure time shift. We measured about −6.8 ms at 2–4 Hz and −1.2 ms at 30–40 Hz, so a single t_ga is a compromise that depends on the motion.
    demo: {from: "intel-t265-plain_small", note: "The 3D scene MVIS recovered from recording 1."}
    header:
      type: "Tracking camera: global-shutter fisheye stereo with a Bosch BMI055 IMU"
      maker: {name: Intel RealSense, url: "https://www.intel.com/content/www/us/en/products/sku/192742/intel-realsense-tracking-camera-t265/specifications.html"}
      links: {product: "https://www.intel.com/content/www/us/en/products/sku/192742/intel-realsense-tracking-camera-t265/specifications.html", product_label: "Intel specifications"}
      image: {kind: photo, file: intel-t265.jpg, alt: "Intel RealSense T265, front view", credit: "Photo: Intel, T265 launch press release", url: "https://www.intc.com/news-events/press-releases/detail/97/intel-announces-new-class-of-realsense-stand-alone"}
      foot: "Maker values checked 2026-11-03; Intel lists it as discontinued · 1 recording · CC BY-NC 4.0"
      key_specs:
        cameras: {v: "848 × 800 fisheye stereo", tag: maker, src: "https://www.intel.com/content/www/us/en/products/sku/192742/intel-realsense-tracking-camera-t265/specifications.html"}
        shutter: {v: Global, tag: catalog}
        fov: {auto: fov, also: {v: "163° diagonal", tag: maker, src: "https://www.intel.com/content/www/us/en/products/sku/192742/intel-realsense-tracking-camera-t265/specifications.html"}}
        baseline: {auto: baseline}
        imu: {v: "BMI055, gyro 200 Hz, accel 62.5 Hz"}
        output: {v: USB 3, tag: maker, src: "https://www.intel.com/content/www/us/en/products/sku/192742/intel-realsense-tracking-camera-t265/specifications.html"}
  looper-insight9:
    group: cameras
    title: LooperRobotics Insight 9
    description: Two global-shutter mono cameras, one rolling-shutter colour camera and a 400 Hz IMU, calibrated with MVIS on a chessboard recording of our own unit and on 10 hand-held and 2 robot-arm recordings.
    lead: Sensor head from Looper Robotics with two global-shutter mono cameras, one rolling-shutter colour camera and a 400 Hz IMU. Our own unit on a chessboard, and the hand-held and robot-arm recordings, are shown separately.
    chips: [Global + rolling shutter, 3 cameras, 400 Hz IMU, Chessboard + hand-held + robot arm, Hand-held data CC BY-NC 4.0]
    example: {url: "/examples/looper-sa16/", label: "Looper SA16"}
    thanks:
      people:
        - {name: Qinrui Yan, role: "COO & Co-Founder, DeepMirror; Head of LooperRobotics", url: "https://www.linkedin.com/in/qinrui-yan-3625aa90"}
        - {name: Junjie Tang, role: DeepMirror, url: "https://www.linkedin.com/in/junjie-tang-271b8033a"}
      note: They collected the hand-held and robot-arm recordings and supported sharing this work openly.
    card: {name: "Insight 9", tags: [Global + rolling shutter, 3 cameras, 400 Hz IMU], sensors: "2 mono + 1 rolling-shutter colour + IMU @ 400 Hz", format: "ROS bag → EuRoC mav0", shows: "Repeatability across 10 hand-held and 2 robot-arm recordings"}
    demo:
      by_variant:
        - {from: "looper-insight9-chessboard_small", note: "The 3D scene MVIS recovered from the chessboard recording of our own unit. Everything except the board is blurred."}
        - {from: "looper-insight9-arm_small", note: "The 3D scene MVIS recovered from robot-arm recording 1."}
        - {from: "looper-insight9-arm_small", note: "The 3D scene MVIS recovered from robot-arm recording 1."}
    hardware:
      - [Type, "Spatial AI camera", Maker]
      - [Global-shutter cameras, "2 × 544×640 mono at 20 Hz, hardware-synced stereo", Catalog]
      - [Rolling-shutter camera, "1 × 1088×1920 colour at about 4.3 Hz", Catalog]
      - [Lens, "Wide field of view; pinhole-equidistant fit", Catalog]
      - [IMU, "1 × 400 Hz, with stamps quantized to 2.5 ms", Catalog]
      - [Sensor part numbers, Not recorded, Unknown]
    dataset:
      - [Chessboard, "1 recording of 42 s, our own unit, taken warm (55 °C)"]
      - [Chessboard data, "__HUB:community/looper-insight9/data/__, takes 01 to 04 (this page shows take 04). Everything except the board is blurred. CC BY-NC 4.0, for the data, clip and figures; commercial use by request"]
      - [Hand-held, "10 of about 66 s, 15.0 GB in all"]
      - [Hand-held data, "__LINK__. CC BY-NC 4.0, for the hand-held data, clip and figures; commercial use by request"]
      - [Robot arm, "2 of about 58 s, same program in both"]
      - [Robot-arm data, "__HUB:community/looper-insight9/data/__. Normal frames. CC BY-NC 4.0, for the data, clip and figures; commercial use by request"]
      - [Board, "Chessboard: 10×7 squares (9×6 inner corners), 43.47 mm, shown on a monitor. Hand-held and robot arm: AprilGrid 6×6, tag 55 mm, spacing 0.3, t36h11"]
      - [Configs and results, "__HUB:community/looper-insight9/__"]
    folder: looper-insight9/
    method: "Camera + IMU with camera intrinsics free, t_ga on and the cam2 rolling-shutter readout estimated. Chessboard recording of 2026-11-07; hand-held batch of 2026-11-02; robot-arm batch of 2026-11-04."
    limits:
      - No reference exists for these recordings, so the tables show repeatability, not accuracy.
      - Hand-held and robot-arm recordings are kept apart, not pooled. They were solved in different batches and may not come from the same unit.
      - Lever arms differ by about 3 mm in y and z, 4.5 to 5 mm in all, between the two sets. The arm program rotates mostly about one axis, which leaves lever arms less well determined, so treat the arm's values with more caution.
      - The colour camera's td differs by about 1.8 ms between the two sets, and the cause isn't established.
      - Robot-arm repeatability rests on 2 recordings.
      - The chessboard recording comes from our own unit, not the partner's, and is shown on its own. It is one warm recording, so it shows no repeatability.
    header:
      type: "Spatial AI camera: stereo pair, rolling-shutter colour camera, 6-axis IMU, VIO"
      maker: {name: LooperRobotics, url: "https://looper-robotics.com/"}
      links: {product: "https://looper-robotics.com/home/product/insight-9/"}
      image: {kind: photo, file: looper-insight9.jpg, alt: "LooperRobotics Insight 9, front view", credit: "Photo: LooperRobotics, Insight 9 product page", url: "https://looper-robotics.com/home/product/insight-9/"}
      foot: "Maker values checked 2026-11-03 for the retail Insight 9 · 1 chessboard recording of our own unit, 42 s, blurred except the board · 10 hand-held recordings of about 66 s, CC BY-NC 4.0 · 2 robot-arm recordings of about 58 s, CC BY-NC 4.0"
      key_specs:
        cameras: {v: "2 mono 544×640, 1 colour 1920×1080", tag: maker, src: "https://looper-robotics.com/home/product/insight-9/"}
        shutter: {v: "Mono global, colour rolling", tag: maker, src: "https://looper-robotics.com/home/product/insight-9/"}
        fov: {auto: fov, cams: {mono: 0, colour: 2}, also: {v: "Colour 188° × 86° × 157° (D × H × V)", tag: maker, src: "https://looper-robotics.com/home/product/insight-9/"}}
        baseline: {v: 100 mm, tag: maker, src: "https://looper-robotics.com/home/product/insight-9/"}
        imu: {v: "BMI088, 6-axis, 400 Hz", tag: maker, src: "https://looper-robotics.com/home/developers/insight9-ros-native-bringup-guide/v2-1-4"}
        output: {v: "USB-C 3.1; ROS 2 or UVC", tag: maker, src: "https://looper-robotics.com/home/developers/insight9-uvc-bringup-guide/v2-1-4"}
