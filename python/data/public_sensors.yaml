    card: {name: "AVS111C-Y stereo", maker: ALG Tech, tags: [Global shutter, 2 cameras, 88 Hz IMU], sensors: "Stereo global-shutter + IMU @ 88 Hz", format: "ROS2 bag → EuRoC mav0", shows: "A stereo + IMU solve on a chessboard, after fixing the IMU's unit scale"}
