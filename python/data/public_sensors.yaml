    method: "Each lens alone with the IMU, then both placed in the one IMU frame. Only the well-excited part of each recording is used: the camera turns about all three axes from 130 s (front) and 100 s (back), and the last 10 s, where it is put down, are left out; 92 s and 97 s. Camera intrinsics (enhanced unified model, EUCM, as in the organisers' calibration) start from a single-camera solve and stay free; the shape of the 7×12 board, rolling-shutter readout, camera time offset, IMU scale and misalignment and the gyro-to-accel offset t_ga are estimated. IMU noise measured on the camera-pair recording, where the camera stands still, and widened about 2.8×. Solved 2026-11-12."
    limits:
      - "The tab with both lenses is put together from two solves, not one joint solve: each lens is placed in the IMU frame by its own recording. Its IMU values and its calibration-process view are those of the front-lens recording."
      - "The distance between the lenses, 36.2 mm here, comes from two camera-to-IMU results, not from one joint solve. It agrees with a direct estimate from the camera-pair recording without the IMU (36–37 mm) and with four 60 s windows (34.6–38.0 mm). The organisers' Kalibr chain gives 40.1 mm. Using the whole recordings, including the first 100–130 s where the camera turns about one axis only, gives about 34 mm; that difference isn't fully explained."
      - "The 7×12 calibration board isn't flat: it bows about 12 mm across its 2.2 m width, the same in both recordings. Treating it as flat moves each lens by up to 10 mm, so the board shape is estimated here; see Board shape."
      - "The organisers publish a Kalibr calibration (EUCM model, IMU intrinsics fixed). It isn't an independent reference: it comes from the same recordings."
      - "The board reaches about 95° from the lens axis, so the outermost part of each 200° image is extrapolated."
      - "The images are JPEG-compressed, which can shift detected corners slightly."
