    title: GI EGO1GS
    description: Head-worn global-shutter fisheye stereo with an IMU at about 470 Hz, calibrated with MVIS on one recording.
    lead: "Two 30-second recordings of an AprilGrid, solved with MVIS for camera, IMU and time offsets."
    chips: [Global shutter, Stereo, 400 Hz IMU, CC BY-NC 4.0]
    card: {tags: [Global shutter, 2 cameras, 400 Hz IMU], sensors: "Stereo global-shutter fisheye + IMU @ 400 Hz", format: "MCAP → EuRoC mav0", shows: "Very wide lenses, and gaps from frames lost at decode"}
    source: https://www.gilabs.xyz/products/ego1gs
    demo: {from: "gi-ego1gs-rec2_small", note: "The 3D scene MVIS recovered from recording 2. Everything except the board is blurred."}
    run_labels: [Recording 1, Recording 2]
    hardware:
      - [Shutter, Global, Maker]
      - [Cameras, "2 × 1080p at 30 fps", Maker]
      - [Field of view, "157° × 84°", Maker]
      - [Baseline, 63 mm, Maker]
      - [IMU rate, "400 Hz published, 470.9 Hz in this recording", Measured]
      - [Audio, Stereo microphones, Maker]
      - [Sensor part numbers, Not published, Unknown]
    dataset:
      - [Recording 1, "2026-07-23, 30.1 s. Frames kept: cam0 821 of 894, cam1 744 of 890"]
      - [Recording 2, "2026-07-24, 30.1 s. Frames kept: 895 of 899 on each camera"]
      - [Frames, "Everything except the board is blurred"]
      - [Format, "MCAP, H.265, 61 MB"]
      - [Board, "AprilGrid 6×6, tag 35.2 mm, spacing 0.3"]
      - ["Bags, configs and results", "__HUB:community/gi-ego1gs/__"]
    folder: gilabs-examples/
    method: "Recording converted to EuRoC layout, camera-only solve per camera, then camera + IMU with camera intrinsics free and t_ga on. Batch of 2026-11-03."
    limits:
      - No independent reference. These values show what MVIS solved, not how close they are to the truth.
      - Recording 1 lost frames on both cameras at decode, so it has gaps.
      - Both recordings are solved from the blurred video. Blurring moved the lever arm by less than 0.1 mm.
    header:
      type: "Head-worn stereo headset: colour global-shutter cameras, 9-DoF IMU, stereo audio"
      maker: {name: General Intelligence Labs, url: "https://www.gilabs.xyz/"}
      links: {product: "https://www.gilabs.xyz/products/ego1gs"}
      image: {kind: photo, file: gi-ego1gs-front.jpg, alt: "GI EGO1GS on a mannequin head, front view", credit: "Photo: General Intelligence Labs, GI EGO1GS product page", url: "https://www.gilabs.xyz/products/ego1gs"}
      foot: "Maker values checked 2026-11-03 · 2 recordings, 30.1 s each · CC BY-NC 4.0"
      key_specs:
        cameras: {v: "Dual 1080p, 30 fps, colour", tag: maker, src: "https://www.gilabs.xyz/blog/ego1gs-vs-project-aria-vs-ego-oscar"}
        shutter: {v: Global, tag: maker, src: "https://www.gilabs.xyz/products/ego1gs"}
        fov: {auto: fov, cams: {cam0: 0, cam1: 1}, also: {v: "157° × 84°", tag: maker, src: "https://www.gilabs.xyz/products/ego1gs"}}
        baseline: {v: 63 mm, tag: maker, src: "https://www.gilabs.xyz/products/ego1gs"}
        imu: {v: "9-DoF, 400 Hz", tag: maker, src: "https://www.gilabs.xyz/products/ego1gs"}
        output: {v: "One .mcap file, H.265", tag: maker, src: "https://www.gilabs.xyz/products/ego1gs"}
      groups:
        - title: Published by the maker
          rows:
            - {item: Audio, v: "Stereo, dual microphones", src: "https://www.gilabs.xyz/products/ego1gs"}
            - {item: Synchronization, v: "All four streams on one hardware clock", src: "https://www.gilabs.xyz/products/ego1gs"}
            - {item: Storage, v: "MicroSD, 128 GB card included", src: "https://www.gilabs.xyz/products/ego1gs"}
            - {item: Connectivity, v: "Wi-Fi and USB", src: "https://www.gilabs.xyz/products/ego1gs"}
            - {item: Power, v: "USB power bank; 12 to 16 hours on 10,000 mAh", src: "https://www.gilabs.xyz/blog/ego1gs-vs-project-aria-vs-ego-oscar"}
            - {item: Weight, v: "About 200 g, headset only", src: "https://www.gilabs.xyz/products/ego1gs"}
        - title: Measured in this recording
          rows:
            - {item: IMU rate, v: 470.9 Hz}
        - title: Maker
          rows:
            - {item: Company, v: "General Intelligence Labs, San Francisco", url: "https://www.gilabs.xyz/"}
        - title: Not published
          rows:
            - {item: Parts, v: "Sensor part numbers, lens model"}
  xq20:
    group: head-worn
    title: XQ20 stereo headset
    description: Head-worn stereo camera with a 300 Hz IMU, calibrated with MVIS on two units.
    lead: Head-worn stereo fisheye camera with a 6-axis IMU, recording to a memory card. Borme, a brand of Shenzhen Feikasi Industrial Co., Ltd., sells it as the XQ20. Two units were calibrated.
    chips: [Stereo, 300 Hz IMU, 2 units, CC BY-NC 4.0]
    card: {tags: [Global shutter, 2 cameras, 300 Hz IMU], sensors: "Stereo fisheye + IMU @ 300 Hz", format: "MP4 + IMU CSV → EuRoC mav0", shows: "Two units of one headset, and why a Kalibr noise file needs care in MVIS"}
    hardware:
      - [Cameras, "2 × 1920×1200, H.265 MP4", Supplier]
      - [Frame rate, "30 or 60 fps on the sheet; about 30 Hz in these recordings", Supplier]
      - [Field of view, "123.6° on the sheet; axis not stated", Supplier]
      - [Model number, XQ20, Listing]
      - [Cameras, "2, dual 1080P, 2 MP, MP4", Listing]
      - [Lens, Fisheye, Listing]
      - [Frame rate, "60 and 30 fps", Listing]
      - [Field of view, "160°; axis not stated", Listing]
      - [Shutter, "Global; not measured in these recordings", Listing]
      - [IMU, "300 Hz; stamped at measurement end, 50 ppm, 32-bit µs", Listing]
      - [IMU, "6-axis, 300 or 600 Hz on the sheet; 300.5 Hz measured", Supplier]
      - [Storage and interface, "microSD up to 128 GB, or UVC; Type-C", Supplier]
      - [Power, No battery, Supplier]
      - [Weight, 180 g with strap, Supplier]
      - [Sensor part numbers, Not given, Unknown]
    dataset:
      - [Recordings, "Unit A: 158 s, 4,736 frames. Unit B: 119 s, 3,573 frames"]
      - [Format, "MP4 plus per-segment IMU CSV, converted to EuRoC layout"]
      - [Board, "AprilGrid 6×6, tag 35.2 mm, spacing 0.3"]
      - [Licence, "CC BY-NC 4.0; commercial use by request"]
      - [Hosted, "__HUB:community/xq20/__"]
    method: "cam0 at 30 Hz, cam1 at 10 Hz, t_ga on, camera intrinsics free, IMU intrinsics pinned. IMU noise padded from the measured noise: gyro 6e-4 rad/s/√Hz, accel 0.015 m/s²/√Hz. Batch of 2026-11-07."
    limits:
      - No independent reference. These values show what MVIS solved, not how close they are to the truth.
      - "The supplier's IMU noise file (gyro 0.002, accel 0.02) is tuned for Kalibr, about 10× and 3× the noise measured at rest. Used as is in MVIS, it put unit A's lever arm 20 to 45 mm too far forward. These results use the measured noise with a 2 to 3× margin."
      - "With IMU intrinsics free, the lever arm's y shifts about 9 mm on both units, more than its 3.5 mm uncertainty. Pinned, it agrees with the supplier's Kalibr, so these results pin the IMU intrinsics."
      - The listing says 1080P and 160°, and the supplier's sheet says 1920×1200 and 123.6°. These recordings are 1920×1200. The listing's shutter value wasn't tested here.
    demo: {from: "xq20-plain_small", note: "The 3D scene MVIS recovered from unit B."}
    header:
      type: "Head-worn stereo fisheye camera with a 6-axis IMU, recording to a memory card"
      maker: {name: "Borme", url: "https://www.alibaba.com/product-detail/1080P-Global-Shutter-Binocular-IMU-Camera_1601882874490.html"}
      links: {product: "https://www.alibaba.com/product-detail/1080P-Global-Shutter-Binocular-IMU-Camera_1601882874490.html", product_label: "Alibaba listing"}
      image: {kind: photo, file: xq20.jpg, alt: "XQ20 head-worn stereo camera on its strap", credit: "Image: the supplier's XQ20 spec sheet"}
      foot: "Supplier values from their spec sheet, received 2026-10-21 · Borme's listing, read 2026-11-04 · 2 units · Data on Hugging Face"
      key_specs:
        cameras: {v: "2 × 1920×1200, H.265", tag: supplier}
        shutter: {v: "Global, not measured", tag: listing, src: "https://www.alibaba.com/product-detail/1080P-Global-Shutter-Binocular-IMU-Camera_1601882874490.html"}
        fov: {auto: fov, also: {v: "160° on the listing, 123.6° on the sheet, axes not stated", tag: listing, src: "https://www.alibaba.com/product-detail/1080P-Global-Shutter-Binocular-IMU-Camera_1601882874490.html"}}
        baseline: {auto: baseline}
        imu: {v: "6-axis, 300 or 600 Hz", tag: supplier}
        output: {v: "MP4 on microSD, or UVC", tag: supplier}
