      - [Maker, Shenzhen Aili-Light Technology (ALG Tech), Maker]
      - [Closest published model, "AVS111C-Y: 1280×800, 50 mm baseline, 120° × 76°, global shutter. Matched from this recording; the exact model isn't confirmed", Maker]
      - [Cameras, "2 × 1280×800, about 26 Hz in this recording", Measured]
      - [Shutter, "Global on the AVS111C-Y sheet; a rolling-shutter solve finds no readout", Measured]
      - [Lens, "1.67 mm, 120° horizontal on the AVS111C-Y sheet", Maker]
      - [IMU, "6-axis, up to 6400 Hz on the sheet; 88 Hz in this recording", Maker]
      - [Link and power, "GMSL2, power over coax, 9 to 12 V", Maker]
    dataset:
      - [Recordings, "1 recording, 24 s. cam0 623 frames, cam1 618, IMU 2,107 samples"]
      - [Format, "ROS2 bag, converted to EuRoC layout"]
      - [Board, "Chessboard 12×9 squares, 25 mm"]
      - [Licence, None]
      - [Hosted, Not hosted]
    method: "Both cameras and the IMU, global shutter, default IMU noise, t_ga on, camera intrinsics free. The IMU stored accel 4× and gyro 2× too small; both were scaled before solving. Batch of 2026-11-06."
    limits:
      - No independent reference, so these values show what MVIS solved, not how close they are to the truth.
      - "A simulation of this recording, solved the same way, shows its IMU samples (about 88 Hz, unevenly spaced) can't pin the IMU scales, the lever arm or the gyro-to-accel offset t_ga, even without noise. Treat those values as unreliable. The camera intrinsics and the stereo baseline aren't affected."
      - With evenly spaced IMU samples at 150 Hz or more, the same simulation recovers most of it. The gyro scale and lever arm also need faster rotation than this recording has.
      - The model is matched from resolution, baseline, field of view and shutter, not confirmed by the maker.
    header:
      type: "GMSL2 stereo camera module with a 6-axis IMU"
      maker: {name: Shenzhen Aili-Light Technology (ALG Tech), url: "https://www.aili-light.com/"}
      contact:
