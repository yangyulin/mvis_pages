  hp-reverb-g2:
    group: vr
    key: hp-reverb-g2
    title: HP Reverb G2
    description: VR headset with 640×480 tracking cameras and a 1 kHz IMU, calibrated with MVIS on the Monado dataset.
    lead: VR headset from HP with four 640×480 grayscale tracking cameras and an IMU at about 1 kHz. All four are solved from the Monado SLAM calibration data, in three pair recordings stitched together.
    chips: [4 cameras, Stitched from pairs, 1 kHz IMU, CC BY 4.0]
    card: {name: "Reverb G2", tags: [4 cameras, 1 kHz IMU], sensors: "4 tracking cameras + IMU @ 1 kHz", format: "EuRoC mav0", shows: "Four cameras stitched from three pair recordings"}
    company: {name: HP, url: "https://www.hp.com/"}
    demo: {existing: "/media/hero/hero_mgc_960", note: "Recovered by MVIS from the Monado calibration data."}
    hardware:
      - [Cameras, "4 × 640×480 grayscale at 30 Hz", Dataset]
      - [IMU, "About 1 kHz", Dataset]
      - [Sensor part numbers, Not published, Unknown]
    dataset:
      - [Recordings, "Monado MGC round 1: imucalib01, 02 and 13, one for each camera pair"]
      - [Source, "Monado SLAM Datasets, Collabora"]
      - [Board, "AprilGrid 6×6, tag 30 mm, spacing 0.3, t36h11"]
      - [Licence, CC BY 4.0]
      - [Hosted copy, "__HUB:datasets/converted/monado_mgc/__"]
      - [Configs and results, "__HUB:community/hp-reverb-g2/__"]
    data_link: {url: "https://huggingface.co/datasets/collabora/monado-slam-datasets", label: "Monado SLAM Datasets"}
    method: "Each recording shows the board to one camera pair, so three pairs are solved: cam0 + cam1, cam0 + cam2, cam1 + cam3. Each is camera + IMU with camera intrinsics free and t_ga on, on current MVIS, 2026-11-03. cam0, cam1 and all IMU values come from the first pair. cam2 is attached through cam0 and cam3 through cam1."
    limits:
      - One recording shown, with no independent reference on this page. These values show what MVIS solved, not how close they are to the truth.
      - This rig is stitched from three solves, not one joint solve. Cameras seen in two pairs agree to 0.89 mm and 0.34° (cam0) and 0.54 mm and 0.15° (cam1). cam2 and cam3 move 0.79 and 0.52 mm depending on how they are attached.
      - The process figure and values for the IMU show the cam0 + cam1 recording only.
    header:
      type: "VR headset with four tracking cameras and a 1 kHz IMU"
      maker: {name: HP, url: "https://www.hp.com/"}
      links: {product: "https://www.hp.com/us-en/newsroom/press-releases/2020/hp-valve-microsoft-next-gen-virtual-reality-headset.html", product_label: "HP announcement"}
      image: {kind: photo, file: hp-reverb-g2.jpg, alt: "HP Reverb G2 headset, front view", credit: "Photo: HP, Reverb G2 press release", url: "https://www.hp.com/us-en/newsroom/press-releases/2020/hp-valve-microsoft-next-gen-virtual-reality-headset.html"}
      foot: "Values from the Monado SLAM Datasets · 1 recording shown · CC BY 4.0 data"
      key_specs:
