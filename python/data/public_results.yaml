# Every word on the Results pages (Leaderboard + one Dataset eval page per dataset) that is not computed from the
# records. Read by mvis_site/results_eval.py; every string goes through lint.public_problems before anything is written.
# Order is page order: our VI-Rig datasets first. Nothing is ever ordered by a measured value.
#
#   slug       URL under /benchmark/results/ (the same slug as the dataset reference pages)
#   id         the record id in families.json (never in a URL)
#   families   in page order, with the shutter of the family's cameras (global | rolling | mixed) for the filter
#   sensors    record sensor label -> stable sensor id, explicit, never guessed; an unmapped label stops the export
#   image      a file already served under site/public, with its alt text and credit
#   legacy     filled by the export: old hashes on /benchmark/results/ that now live on this page

leaderboard:
  honest:
    - "<b>Repeatability, not accuracy.</b> These datasets have no ground truth, so no tool is the reference. A cell shows whose estimates scatter least over the recordings every compared tool ran, not who is right."
    - "<b>Who ran it:</b> the MVIS authors ran every tool, including Kalibr and Basalt, with its documented defaults unless a family's notes say otherwise."
    - "<b>No totals:</b> nothing is added up across cells, families or datasets, and rows are never ordered by a value."

