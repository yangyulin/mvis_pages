  - slug: uzh-fpv
    id: uzh_fpv
    label: UZH-FPV
    title: UZH-FPV
    ours: false
    study: true
    study_note: "Separate study (batch 2026-11-04): no repeatability cells on the current schema, so it has no row here."
    licence: CC BY-NC-SA 3.0
    intro: "The camera–IMU calibration bags of the UZH-FPV Drone Racing dataset: an mDAVIS346 and a Snapdragon Flight, each recorded indoors and outdoors, at 45° and facing forward. A one-off study, not part of the leaderboard batch or the regression suite."
    chips: ["2 devices, 4 bags each", "AprilGrid 5×4, 75 mm"]
    image: {src: /media/hero/hero_uzhd_960.jpg, alt: "MVIS solving a UZH-FPV Davis bag: board, camera path and one camera frame", credit: "MVIS solve view, from the homepage"}
    links:
      example: /benchmark/examples/uzh-fpv/
    no_repeatability: "This study has no repeatability cells: it was made before the current schema, and 4 bags per device are too few for the test (it needs 6)."
    reading:
      - "<b>IMU weights.</b> All three tools use IMU sigmas taken from the residuals in UZH's own Kalibr results, not the MVIS defaults. The example page explains how they are derived."
      - "<b>One Basalt solve is left out.</b> On davis_indoor_forward with these weights, Basalt gives a 120 mm lever and an accel scale (accelerometer scale factor) of 0.84. So its Davis column has 3 of 4 bags. At Basalt's default noise that bag is plausible, but snapdragon_indoor_45 then fails with a broken spline."
      - "<b>Basalt's Davis distance stands out.</b> Its camera-to-IMU distance is 33.6 mm. Kalibr gives 23.2 mm and MVIS 22.8 mm on the same 3 bags. We haven't established why. At default noise Basalt's lever z is 14–25 mm."
      - "<b>Each device's 4 bags form one family</b>, because the camera and IMU are on the same device. That assumes the camera–IMU geometry stayed the same across recordings, which we can't confirm."
      - "<b>Snapdragon's time offset really does differ between bags</b>, with an sd (standard deviation) near 4.7 ms in every tool. So a small difference between tools on that row says little about each bag."
    families:
      - {id: DAVIS, shutter: global}
      - {id: SNAP, shutter: global}
    sensors:
      "cam0 – mDAVIS346": cam0
      "base IMU – DAVIS IMU": imu0
      "cam0 – Snapdragon left": cam0
      "cam1 – Snapdragon right": cam1
      "base IMU – Snapdragon IMU": imu0
