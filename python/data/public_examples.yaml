# Text for the public openmvis.com example pages (/benchmark/examples/<slug>/). No internal path, code hash or device id.
# Numbers come from the run named in the private mira sensors.yaml `examples:` section (passed to export_examples.py by
# path), never from here. The config shown on a page is that run's own config with paths cut to file names.
# The order below is the order on the site: overview cards and sidebar. Every photo lives in data/photos, 800×533.
steps:
  - {name: Demo and values, text: "what the page shows, the scene MVIS recovered from the dataset, and the run's headline values."}
  - {name: Calibration process, text: "MVIS's own player: the detected corners, then the rig's path as the solve refines it."}
  - {name: Solved rig, text: "a 3D map of the solved rig and a table of every camera and IMU: intrinsics, lever arm, rotation as log(R), time offsets."}
  - {name: Check against a reference, text: "MVIS beside a published calibration and the difference, where one exists. Where none does, the page says so."}
  - {name: Config and run, text: "the run's own config with the lines that matter marked and explained, the command, and what you need to get the same numbers."}
  - {name: Dataset, text: "the recording, its board drawn to scale, and where to download it."}
examples:
  virig-4imus-3cams:
    title: "VI-Rig: 4 IMUs + 3 cameras"
    nav: VI-Rig 4 IMUs + 3 cams
    description: One MVIS camera + IMU run on our own rig, with three global-shutter cameras and four IMUs solved together.
    ours: true
    maker: OpenMVIS
    image: {file: vi-rig.jpg, alt: "VI-Rig: three cameras and four IMUs on one white frame", credit: "Photo: OpenMVIS"}
    clip: virig3
    card:
      rig: 3 global-shutter cameras + 4 IMUs (100–500 Hz) on one frame
      format: ROS1 bag
      shows: Every camera and IMU solved together in one run, the multi-IMU case
      tags: [Global shutter, 3 cameras, 4 IMUs, CC BY-NC 4.0]
    facts:
      - [Cameras, "3 global shutter: Blackfly S + T265 fisheye pair"]
      - [IMUs, "4: Xsens MTi (base), 2 MicroStrain, T265"]
      - [Board, "AprilGrid 6×6, tag 88 mm"]
      - [Format, "ROS1 bag"]
      - [Licence, "CC BY-NC 4.0"]
    lead: "One MVIS camera + IMU run on recording april_01: every camera and all four IMUs solved together."
    dataset: {url: /reference/datasets/virig-4imus-3cams/, label: VI-Rig 4 IMUs + 3 cams dataset page}
    eval: {slug: virig-4imus-3cams, label: All 10 recordings and three tools}
    data:
      - "Recording april_01, one of the 10 recordings of this rig. MVIS picks the 80 s window with the most motion."
      - "Cameras: a Blackfly S (pinhole with radial-tangential distortion) and the two T265 fisheye cameras (equidistant lens model)."
      - "IMUs: the Xsens MTi is the base IMU; the two MicroStrain units and the T265's own IMU are solved against it."
      - "Board: AprilGrid 6×6, tag 88 mm, spacing 0.3, t36h11."
    config:
      name: virig_4imus_3cams_cam_imu.yaml
      why:
        input.imu_topics: Four IMU topics. The first is the base IMU; the other three are solved against it.
        input.window_mode: MVIS picks the 80 s window with the most motion.
        camera_input.cameras: The two T265 cameras are added to the graph at 4 Hz, which keeps the solve small.
        solve.sigma_g: IMU noise from a still recording of this rig, measured density × 2.5. The other three sigmas are set the same way.
        estimate.board_points: The printed board is not quite flat, so its shape is estimated too.
        estimate.camera.intrinsics: Camera intrinsics stay free in the camera + IMU solve.
    reference:
      none: >-
        No published calibration exists for this rig, so this page has nothing to compare against. What we can show is
        how much each value moves from one recording to the next.
    reproduce:
      batch: MVIS main, measured-noise batch of 2026-11-08
  virig-4imus-4cams:
    title: "VI-Rig: 4 IMUs + 4 cameras"
    nav: VI-Rig 4 IMUs + 4 cams
    description: One MVIS camera + IMU run on our own rig, with two global-shutter and two rolling-shutter cameras and four IMUs solved together.
    ours: true
    maker: OpenMVIS
    image: {file: vi-rig.jpg, alt: "VI-Rig frame, shown in its 3-camera setup; this recording swaps the Blackfly for an ELP rolling-shutter stereo pair", credit: "Photo: OpenMVIS (3-camera setup)"}
    clip: virig4
    card:
      rig: T265 fisheye pair (global) + ELP stereo (rolling) + 4 IMUs (100–500 Hz) on one frame
      format: ROS1 bag
      shows: Global and rolling shutter cameras with four IMUs in one run, readout included
      tags: [Global + rolling shutter, 4 cameras, 4 IMUs, CC BY-NC 4.0]
    facts:
      - [Cameras, "4: T265 fisheye pair (global shutter) + ELP stereo pair (rolling shutter)"]
      - [IMUs, "4: Xsens MTi (base), 2 MicroStrain, T265"]
      - [Board, "AprilGrid 6×6, tag 88 mm"]
      - [Format, "ROS1 bag"]
      - [Licence, "CC BY-NC 4.0"]
    lead: "One MVIS camera + IMU run on recording 4imus_4cams_01: all four cameras and all four IMUs solved together."
    dataset: {url: /reference/datasets/virig-4imus-4cams/, label: VI-Rig 4 IMUs + 4 cams dataset page}
    eval: {slug: virig-4imus-4cams, label: All 15 recordings and tools}
    data:
      - "Recording 4imus_4cams_01, one of the 15 recordings of this rig. MVIS picks the 80 s window with the most motion."
      - "Cameras: the two T265 fisheye cameras (global shutter) and the ELP stereo pair (rolling shutter), all with the equidistant lens model."
      - "IMUs: the Xsens MTi is the base IMU; the two MicroStrain units and the T265's own IMU are solved against it."
      - "Board: AprilGrid 6×6, tag 88 mm, spacing 0.3, t36h11."
    config:
      name: virig_4imus_4cams_cam_imu.yaml
      why:
        input.imu_topics: Four IMU topics. The first is the base IMU; the other three are solved against it.
        input.window_mode: MVIS picks the 80 s window with the most motion.
        camera_input.cameras: The ELP cameras are rolling shutter, so their readout time is estimated. The three cameras after the first are added to the graph at 4 Hz, which keeps the solve small.
        solve.sigma_g: The same IMU noise values as the 3-camera example, which has the same Xsens base IMU.
        estimate.board_points: The printed board is not quite flat, so its shape is estimated too.
        estimate.camera.intrinsics: Camera intrinsics stay free in the camera + IMU solve.
    reference:
      none: >-
        No published calibration exists for this rig, so this page has nothing to compare against. What we can show is
        how much each value moves from one recording to the next.
    reproduce:
      batch: "MVIS main, 2026-11-10"
  virig-5imus-4cams:
    title: "VI-Rig: 5 IMUs + 4 cameras"
    nav: VI-Rig 5 IMUs + 4 cams
    description: One MVIS camera + IMU run on our own rig, with two T265 fisheye pairs and five IMUs solved together.
    ours: true
    maker: OpenMVIS
    image: {file: vi-rig.jpg, alt: "VI-Rig frame, shown in its 3-camera setup; this recording carries two T265 units and five IMUs", credit: "Photo: OpenMVIS (3-camera setup)"}
    clip: virig5
    card:
      rig: Two T265 fisheye pairs (global) + 5 IMUs (100–500 Hz) on one frame
      format: ROS1 bag
      shows: Two T265 units that are not synced to each other, tied through five IMUs in one run
      tags: [Global shutter, 4 cameras, 5 IMUs, CC BY-NC 4.0]
    facts:
      - [Cameras, "4 global shutter: two T265 fisheye pairs"]
      - [IMUs, "5: Xsens MTi (base), 2 MicroStrain, 2 T265"]
      - [Board, "AprilGrid 6×6, tag 88 mm"]
      - [Format, "ROS1 bag"]
      - [Licence, "CC BY-NC 4.0"]
    lead: "One MVIS camera + IMU run on recording 5imus_4cams_01: all four cameras and all five IMUs solved together."
    dataset: {url: /reference/datasets/#hosted--vi-rig-captures, label: VI-Rig datasets}
    eval: {slug: virig-5imus-4cams, label: All 7 recordings}
    data:
      - "Recording 5imus_4cams_01, one of the 7 recordings of this rig. It is about 59 s long, shorter than the 80 s window MVIS asks for, so the whole recording is used."
      - "Cameras: the fisheye pairs of two T265 units, all global shutter, with the equidistant lens model. Each pair is synced inside its unit, but the two units are not synced to each other; their time offsets are solved against the base IMU."
      - "IMUs: the Xsens MTi is the base IMU; the two MicroStrain units and the two T265 IMUs are solved against it."
      - "Board: AprilGrid 6×6, tag 88 mm, spacing 0.3, t36h11."
    config:
      name: virig_5imus_4cams_cam_imu.yaml
      why:
        input.imu_topics: Five IMU topics. The first is the base IMU; the other four are solved against it.
        input.window_mode: MVIS picks the 80 s window with the most motion; this recording is shorter, so all of it is used.
        camera_input.cameras: The three cameras after the first are added to the graph at 4 Hz, which keeps the solve small.
        camera_input.path: The starting camera intrinsics, from camera-only solves of all 7 recordings.
        solve.estimate_t_ga: Estimates t_ga, the time offset between the gyroscope and the accelerometer. The T265 IMUs need it most.
        estimate.board_points: The printed board is not quite flat, so its shape is estimated too.
        estimate.camera.intrinsics: Camera intrinsics stay free in the camera + IMU solve.
    reference:
      none: >-
        No published calibration exists for this rig, so this page has nothing to compare against. What we can show is
        how much each value moves from one recording to the next.
    reproduce:
      batch: "MVIS main, 2026-11-10"
  tum-vi:
    title: TUM VI
    nav: TUM VI
    description: One MVIS camera + IMU run on the TUM VI calibration data, compared with TUM's published Kalibr calibration.
    maker: TUM Computer Vision Group
    image: {file: tum-vi-rig.jpg, alt: "TUM VI sensor rig: two fisheye cameras, IMU board and a small PC, with motion-capture markers", credit: "Photo: TUM Computer Vision Group, TUM VI dataset page, CC BY 4.0", url: "https://cvg.cit.tum.de/data/datasets/visual-inertial-dataset"}
    clip: tumvi
    card:
      rig: Stereo 1024² fisheye + BMI160 @ 200 Hz
      format: ROS1 bag
      shows: One MVIS run vs TUM's published Kalibr calibration
      tags: [Global shutter, 2 cameras, 200 Hz IMU, CC BY 4.0]
    facts:
      - [Cameras, "2 × 1024² global-shutter fisheye, 20 Hz"]
      - [IMU, "Bosch BMI160, 200 Hz"]
      - [Board, "AprilGrid 6×6, tag 88 mm"]
      - [Format, "ROS1 bag"]
      - [Licence, "CC BY 4.0"]
    lead: "One MVIS camera + IMU run on dataset-calib-imu1, and how close it lands to TUM's published Kalibr calibration."
    dataset: {url: "https://cvg.cit.tum.de/data/datasets/visual-inertial-dataset", label: TUM VI dataset page}
    eval: {slug: tum-vi, label: All recordings and tools}
    data:
      - "Recording dataset-calib-imu1, the first of TUM's four camera + IMU calibration recordings, at 1024 × 1024."
      - "Cameras: two global-shutter fisheye cameras at 20 Hz, fitted with the kb4 (Kannala-Brandt) lens model. IMU: Bosch BMI160 at 200 Hz."
      - "Board: AprilGrid 6×6, tag 88 mm, spacing 0.3, t36h11."
    config:
      name: tum_vi_imu1_cam_imu.yaml
      why:
        input.window_mode: MVIS picks the 80 s window with the most motion.
        camera_input.path: "Seed intrinsics: kb4 values from MVIS camera-only solves of TUM's eight camera recordings."
        camera_input.cameras: cam1 is added to the graph at 8 Hz, which keeps the solve small.
        solve.estimate_t_ga: Estimates t_ga, the time offset between the gyroscope and the accelerometer.
        estimate.camera.intrinsics: Camera intrinsics stay free in the camera + IMU solve.
        estimate.imu: The gyro and accelerometer scale and misalignment (dw_da) are estimated too. IMU noise is left at the MVIS defaults.
    reference:
      label: TUM (Kalibr)
      source: "TUM's published camera + IMU calibration for the 1024 × 1024 data, Kalibr pinhole-equidistant (the kb4 model), from the TUM VI dataset page"
      url: "https://cvg.cit.tum.de/data/datasets/visual-inertial-dataset"
      cams:
        - {name: cam0, p_mm: [45.38, -72.68, -45.07], rotvec: [-0.04129, -2.17242, 2.24813], fx: 380.81}
        - {name: cam1, p_mm: [-55.52, -71.1, -47.83], rotvec: [-0.0417, -2.22426, 2.19622], fx: 379.29}
      td_text: not in TUM's calibration file
      notes:
        - "The rotation differs by about 9.4 mrad on both cameras. That offset is systematic: MVIS gives the same rotation on all four TUM calibration recordings. It is not explained yet. One possible cause, not verified: this run uses the raw IMU, while TUM's Kalibr run used an IMU model it had already calibrated, so the two IMU frames may differ by a small rotation."
        - "Lens model note: on these lenses the kb4 polynomial folds back inside the image, past about 114° (682 px from the centre) on cam0 and 119° (705 px) on cam1. The model gives no ray beyond that radius."
    reproduce:
      batch: MVIS main, example solves of 2026-11-10
    folds:
      - title: Other lens models
        key: kb4 is shown here
        text: >-
          This page uses kb4, the default MVIS fisheye model. How other lens models fit these cameras is covered on the
          camera model page.
        link: {url: /concepts/camera-model/, label: Camera model}
  monado:
    title: "Monado: HP Reverb G2"
    nav: Monado (Reverb G2)
    description: One MVIS camera + IMU run on the Monado SLAM calibration data of an HP Reverb G2, compared with Monado's own calibration.
    maker: Collabora · Monado SLAM Datasets
    image: {file: hp-reverb-g2.jpg, alt: "HP Reverb G2 headset, front view", credit: "Photo: HP, Reverb G2 press release", url: "https://www.hp.com/us-en/newsroom/press-releases/2020/hp-valve-microsoft-next-gen-virtual-reality-headset.html"}
    clip: mgc
    card:
      rig: HP Reverb G2, tracking-camera pair + IMU @ 1 kHz
      format: EuRoC mav0
      shows: A consumer headset from public data, vs Monado's own calibration
      tags: [2 cameras, 1 kHz IMU, CC BY 4.0]
    facts:
      - [Cameras, "2 × 640×480 grayscale, 30 Hz (front pair)"]
      - [IMU, "About 1 kHz"]
      - [Board, "AprilGrid 6×6, tag 30 mm"]
      - [Format, "EuRoC mav0"]
      - [Licence, "CC BY 4.0"]
    lead: "One MVIS camera + IMU run on the HP Reverb G2 recording imucalib01 (round 1), and how close it lands to the calibration Monado ships with the data."
    dataset: {url: "https://huggingface.co/datasets/collabora/monado-slam-datasets", label: Monado SLAM Datasets}
    sensor: {url: /devices/hp-reverb-g2/, label: HP Reverb G2 in the Device wiki}
    eval: {slug: monado-mgc, label: All recordings and tools}
    data:
      - "Recording MGC imucalib01, round 1, from the Monado SLAM Datasets (Collabora). It shows the board to the front camera pair, cam0 and cam1."
      - "Cameras: 640 × 480 grayscale at 30 Hz, fitted with the equidistant lens model, as in the MVIS regression config for this headset. IMU at about 1 kHz."
      - "Board: AprilGrid 6×6, tag 30 mm, spacing 0.3, t36h11. The tag is much smaller than the usual 88 mm, and board size scales every translation."
    config:
      name: monado_mgc_imucalib01_cam_imu.yaml
      why:
        board.tag_size: "The 30 mm tag. A wrong tag size gives a calibration that converges cleanly and is uniformly wrong in scale."
        input.window_mode: MVIS picks the 80 s window with the most motion.
        camera_input.cameras: cam1 is added to the graph at 8 Hz, which keeps the solve small.
        solve.estimate_t_ga: Estimates t_ga, the time offset between the gyroscope and the accelerometer.
        estimate.camera.intrinsics: Camera intrinsics stay free in the camera + IMU solve.
    reference:
      label: Monado (Basalt)
      source: "The Basalt calibration Monado ships with the HP Reverb G2 data (MG_reverb_g2, extras, calibration)"
      url: "https://huggingface.co/datasets/collabora/monado-slam-datasets"
      cams:
        - {name: cam0, p_mm: [-51.95, 12.66, 5.7], rotvec: [-0.34563, 0.07561, 1.5383]}
        - {name: cam1, p_mm: [56.45, 13.37, 5.82], rotvec: [-0.07256, 0.34453, 1.59451]}
      fx_text: "not comparable: Basalt used an 8-parameter radial-tangential lens"
      td_text: "fixed at 0 in that file, not an estimate"
      notes:
        - "Monado ships a second, equidistant calibration of the same headset. Its rotations differ from this file's by about 4.5 mrad, so a few mrad is within how much the references themselves disagree."
    reproduce:
      batch: MVIS main, example solves of 2026-11-10
    folds:
      - title: The other two camera pairs
        key: Device wiki
        text: >-
          The headset has four cameras, and each recording shows the board to one pair. The sensor page stitches all
          four together from three pair recordings.
        link: {url: /devices/hp-reverb-g2/, label: HP Reverb G2}
      - title: t_ga on and off
        key: Why calibrate t_ga
        text: >-
          This run estimates t_ga, the time offset between the gyroscope and the accelerometer, as every MVIS camera +
          IMU run does by default. What happens to tools that cannot model it is shown on its own page.
        link: {url: /why/tga/, label: Why calibrate t_ga}
