# Overall tab, rubric v1: the cells, rules and public reasons behind overall.json (python/mvis_site/overall.py).
# Public text only: no internal path, code hash or rating word (lint.BANNED). The source citations for every cell
# are kept in the private plan; the page links the challenge template so anyone can dispute a cell.
version: 1
rubric: v1
date: 2026-11-08
tools: [MVIS, Kalibr, Basalt]
challenge_url: https://github.com/yangyulin/mvis_pages/issues/new?template=rubric-challenge.yml
# The template lives in this repo (.github/ISSUE_TEMPLATE/rubric-challenge.yml); a test keeps its aspect list in step.

wording:
  banner: "Derived total, rubric v1 ({date}). The MVIS authors ran every tool, including Kalibr and Basalt. Challenge any cell:"
  truth: "Real recordings have no ground truth. Measured points are repeatability only: a tool can repeat well and still be biased."
  total_note: "The derived total is the mean of the three tier values, each tier the mean of its aspects."
  facts_note: "Maturity, papers and licence are shown, not counted."
  columns:
    Kalibr: "Kalibr, default settings (view shuffle on). Camera-only runs start from the MVIS focal length."
    Basalt: "Basalt 0.1.7. Capabilities as released; measured cells from our headless build with robustness patches."
  home:
    MVIS: Designed into MVIS
    Kalibr: Kalibr feature
    Basalt: Basalt feature
    shared: Shared
    mixed: Mixed

# Tier A: pairwise and gated on repeatability.json. A decisive pair gives 1 / 0, a tie 0.5 / 0.5; a pair counts only
# when neither tool carries an excluding caveat in the cell; a cell whose remaining decisive pairs form a cycle has no
# points. Family points per pair = mean over its groups; aspect value per tool = mean over its (pair, family) points.
measured:
  excluding_caveats:
    kalibr_seeded: [Kalibr]
    kalibr_old_seed: [Kalibr]
    kalibr_gs_elp: [Kalibr]
    basalt_snapped: [Basalt]
    settings_differ: all
  # Counted although the caveat is shown, and why.
  count_despite:
    - {caveat: settings_differ, families: [T6], why: "Kalibr now starts from its own camera calibration; the remaining differences (board shape, data windows) are tool settings."}
  out_of_scope:
    - {family: T7, why: "Kalibr has no rolling-shutter camera-IMU model, so no like-for-like T7 run exists."}
  aspects:
    - {id: A1, label: Camera-only repeatability, mode: cam, groups: [focal_pp, distortion, baseline],
       rule: "Spread of focal length, principal point, distortion and camera distance across recordings of one rig."}
    - {id: A2, label: Camera-IMU repeatability, mode: cam+imu, groups: [lever, gyro, accel],
       rule: "Spread of the camera-IMU distance, gyro and accel terms. The time offset is left out: MVIS also fits a gyro-accel delay."}
    - {id: A3, label: Rolling-shutter readout repeatability, na: "inputs differ between tools",
       rule: "Readout spread.", why: "On T2 the lens models differ (MVIS equidistant, Kalibr RS radtan); T8 and T11 have one tool only."}
    - {id: A4, label: Accuracy against known truth, na: "not measured",
       rule: "Error against simulation truth, all tools on the same rendered data.",
       why: "Accuracy against known truth: not measured for any tool. It needs simulated recordings run through all three tools."}
    - {id: A5, label: Solve robustness,
       rule: "Share of attempted rows that end ok and physical, on rows the tool's model supports. 1 = at least 99 %, 0.5 = 90-99 %, 0 = under 90 %.",
       points: {MVIS: 1, Kalibr: 0.5, Basalt: 1},
       detail: {MVIS: "176 of 176", Kalibr: "90 of 92", Basalt: "76 of 76, provisional"},
       why: "Kalibr: one final fail and one unphysical IMU fit. Basalt: our build with robustness patches; physicality on three families unchecked."}
    - {id: A6, label: Runtime, na: "pending", rule: "Bag to calibration, detection included, same machine, same rows.",
       why: "Timing definitions differ between the tools today."}

# Tier C and U: absolute. Supported = 1, partial or experimental = 0.5, none = 0; an aspect with sub-checks is their mean.
tiers:
  - id: C
    label: Capability
    aspects:
      - {id: C1, group: Camera, label: "Lens models, fisheye included", home: shared,
         rule: "(a) pinhole-radtan (b) KB4 / equidistant (c) a unified wide model (d) mixed models per rig",
         points: {MVIS: 1, Kalibr: 1, Basalt: 1}}
      - {id: C2, group: Camera, label: Calibration targets, home: shared, rule: "1 = two or more target families, 0.5 = one",
         points: {MVIS: 1, Kalibr: 1, Basalt: 0.5}, note: {Basalt: "AprilGrid only"}}
      - {id: C3, group: Camera, label: Board model, home: MVIS, rule: "Estimates a non-planar board",
         points: {MVIS: 1, Kalibr: 0, Basalt: 0}}
      - id: C4
        group: Both
        label: Rolling shutter
        home: MVIS
        subs:
          - {id: a, label: RS single camera}
          - {id: b, label: RS multi-camera}
          - {id: c, label: RS camera + IMU}
          - {id: d, label: Mixed GS + RS rig with IMU}
        points: {MVIS: [1, 1, 1, 1], Kalibr: [1, 0, 0, 0], Basalt: [0, 0, 0, 0]}
      - id: C5
        group: Both
        label: Time offsets and clocks
        home: mixed
        subs:
          - {id: a, label: Camera-IMU time offset}
          - {id: b, label: "Per-camera time offset from a free start (0.5 = needs roughly synced cameras)"}
          - {id: c, label: "Camera-camera offset without an IMU on the default path (0.5 = exists, not on the command-line path)"}
          - {id: d, label: Host-clock sync for network-stamped sensors, home: Kalibr}
          - {id: e, label: Gyro-accel time offset, home: MVIS}
        points: {MVIS: [1, 1, 0.5, 0, 1], Kalibr: [1, 0.5, 0, 1, 0], Basalt: [1, 0, 0, 0, 0]}
      - id: C6
        group: Cam-IMU
        label: IMU intrinsic model
        home: mixed
        subs:
          - {id: a, label: "Scale + misalignment, gyro and accel"}
          - {id: b, label: Gyro g-sensitivity}
          - {id: c, label: Accel size effect, home: Kalibr}
          - {id: d, label: Bias random walk}
        points: {MVIS: [1, 1, 0, 1], Kalibr: [1, 1, 1, 1], Basalt: [1, 0, 0, 0]}
      - id: C7
        group: Cam-IMU
        label: Multi-sensor rigs
        home: mixed
        subs:
          - {id: a, label: Several cameras + IMU}
          - {id: b, label: Several IMUs, spatial}
          - {id: c, label: Several IMUs, time offsets, home: MVIS}
        points: {MVIS: [1, 1, 1], Kalibr: [1, 1, 0.5], Basalt: [1, 0, 0]}
      - {id: C8, group: Cam-IMU, label: Trajectory model, home: [Kalibr, Basalt],
         rule: "1 = continuous-time spline; 0.5 = discrete states with a known bias", points: {MVIS: 0.5, Kalibr: 1, Basalt: 1}}
      - {id: C9, group: Cam-IMU, label: Mocap-to-IMU, home: Basalt, rule: Supported, points: {MVIS: 0, Kalibr: 0, Basalt: 1}}
      - {id: C10, group: Camera, label: Vignetting, home: Basalt, rule: "Experimental = 0.5", points: {MVIS: 0, Kalibr: 0, Basalt: 0.5}}
      - {id: C11, group: Both, label: Calibration simulation, home: MVIS,
         rule: "1 = scenario generator with images or bags; 0.5 = re-simulates corners from a calibration",
         points: {MVIS: 0.5, Kalibr: 0, Basalt: 0}}
  - id: U
    label: Usability
    aspects:
      - {id: U1, label: Install and platforms, home: shared, rule: "1 = prebuilt packages for a current OS; 0.5 = source build or container",
         points: {MVIS: 0.5, Kalibr: 0.5, Basalt: 1}}
      - {id: U2, label: Public docs per feature, home: shared, rule: "1 = a guide or wiki page per feature; 0.5 = one calibration doc",
         points: {MVIS: 1, Kalibr: 1, Basalt: 0.5}}
      - id: U3
        label: Reports and diagnostics
        home: shared
        subs:
          - {id: a, label: "Per-run report (0.5 = GUI view only)"}
          - {id: b, label: Apply a calibration and recalibrate in the tool}
          - {id: c, label: Standalone validator or focus tool}
        points: {MVIS: [1, 1, 0], Kalibr: [1, 0, 1], Basalt: [0.5, 0, 0]}
      - {id: U4, label: Export formats, home: shared, rule: "1 = two or more external formats or tools; 0.5 = one",
         points: {MVIS: 0.5, Kalibr: 1, Basalt: 0.5}}

# Shown beside the tiers, no points. draft_points: how the first draft counted them (the disclosure preset).
facts:
  - {id: P1, label: "Public since, GitHub stars", values: {MVIS: "unreleased (0.1.0)", Kalibr: "2014, about 5.8k", Basalt: "2019, about 1.0k"},
     draft_points: {MVIS: 0, Kalibr: 1, Basalt: 1}}
  - {id: P2, label: Peer-reviewed papers, values: {MVIS: "IJRR 2024, on the C++ predecessor", Kalibr: "5 papers", Basalt: "3DV 2018, CVPR 2020"},
     draft_points: {MVIS: 0.5, Kalibr: 1, Basalt: 1}}
  - {id: P3, label: Licence, values: {MVIS: "GPL-3.0 or commercial", Kalibr: BSD, Basalt: BSD-3},
     draft_points: {MVIS: 0.5, Kalibr: 1, Basalt: 1},
     note: "BSD: use in closed products with the notice kept. GPL-3.0: free, but products that ship it must be GPL too; a commercial licence is available."}

not_counted:
  - "IMU-only calibration without a camera: none of the three tools, so it does not separate them."
  - "Number of IMU conventions: a convention, not a quality lever."
  - "Uncertainty output: pending, Basalt not checked."
  - "Determinism: MVIS gives the same result when run twice (to rounding); Kalibr's default view shuffle varies run to run. Not counted until it has a rule."

# Reader presets: a tier list, or an aspect list (A, C and U ids; C4a-style ids take one sub-check).
presets:
  - {id: equal, label: "Equal tiers A, C, U (default)", tiers: [A, C, U]}
  - {id: algorithm, label: "Algorithm only (A + C)", tiers: [A, C]}
  - {id: capability, label: Capability only, tiers: [C]}
  - {id: usability, label: Usability only, tiers: [U]}
  - {id: no_home, label: "Capability without any tool's home rows or sub-checks", tiers: [C], drop_home: true}
  - {id: measured, label: "Measured only (A1 + A2 + A5)", tiers: [A]}
  - {id: camonly_measured, label: "Camera-only measured (A1)", aspects: [A1]}
  - {id: camonly_user, label: "Camera-only user (C1-C3, C4 a-b, C10, C11, A1)", aspects: [C1, C2, C3, C4a+b, C10, C11, A1]}
  - {id: gs_camimu_user, label: "GS camera-IMU user (C5-C9)", aspects: [C5, C6, C7, C8, C9]}
  - {id: rs_camimu_user, label: "RS or mixed-rig camera-IMU user (C4-C9)", aspects: [C4, C5, C6, C7, C8, C9]}
  - {id: first_draft, label: "First draft: maturity, papers, licence counted (old tier G)", first_draft: true}
