<!doctype html>
<!-- Legacy jemdoc URL. Kept as a real file (not an Astro `redirects` entry) so
     that /QuickStart.html resolves — a redirects key ending in .html builds as a
     directory, which GitHub Pages will not serve at that path. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<link rel="canonical" href="/getting-started/quickstart/">
<meta http-equiv="refresh" content="0; url=/getting-started/quickstart/">
<meta name="robots" content="noindex">
</head>
<body>
<p>This page has moved to <a href="/getting-started/quickstart/">/getting-started/quickstart/</a>.</p>
</body>
</html>
